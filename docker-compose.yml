# EFT Buddy — the full stack, for the Raspberry Pi 5 that hosts it.
#
# Usage:
#
#   git clone <repo> ~/eftbuddy && cd ~/eftbuddy
#   cp .env.example .env          # then fill it in — every variable is documented there
#   GIT_SHA=$(git rev-parse --short HEAD) docker compose build   # on the target host
#   docker compose run --rm migrate   # migrations BEFORE the first boot
#   docker compose up -d app          # starts db first and waits for it to be healthy
#
# The GIT_SHA prefix stamps the image with the revision it was built from and is
# what makes `curl .../health | jq -r .version` able to answer "did my deploy
# actually land?". It is optional — without it the image reports "unknown".
#
# ROOTLESS DOCKER. The host runs the daemon as an unprivileged user, so a
# container breakout lands as that user rather than as root. Two consequences
# show up here: the database uses a named volume rather than a bind mount (bind
# mounts inherit the UID-mapping of the user namespace, which makes ownership
# fiddly for no benefit), and nothing may publish a port below 1024. Neither is
# a constraint this file works around — it is why the file looks the way it does.
#
# ARCHITECTURE. The Dockerfile builds unmodified on amd64 and arm64, so no
# BUILDER_IMAGE override belongs here. An earlier version of this file carried
# one because the Dockerfile's Debian pin had no amd64 manifest; the pin itself
# was fixed instead, which is why that workaround is gone. If a build ever dies
# with "no match for platform in manifest" again, fix the pin in the Dockerfile
# rather than re-adding an override here — an override drifts silently from the
# image CI actually tests.

services:
  # The database. Local, and the primary — there is no hosted copy any more.
  #
  # It publishes NO host ports, deliberately. `app` reaches it as `db` over the
  # compose network, and nothing on the LAN can route to it at all. For a psql
  # prompt, go through the container:
  #
  #     docker compose exec db psql -U eftbuddy -d eft_buddy_prod
  db:
    image: postgres:17
    restart: unless-stopped
    # Postgres uses shared memory for parallel query workers; Docker's 64MB
    # default is small enough to make them fail under load.
    shm_size: 256mb
    environment:
      POSTGRES_USER: eftbuddy
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: eft_buddy_prod
      # A SUBDIRECTORY of the mount, not its root. The image refuses to
      # initialise into a directory that already has content, and a stray
      # lost+found at the volume root is enough to trip that check.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `app` and `migrate` both gate on this, so it has to mean "ready to serve
      # queries", not "process started". pg_isready checks exactly that.
      test: ["CMD-SHELL", "pg_isready -U eftbuddy -d eft_buddy_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - postgres
      # Tuned for 8GB RAM, 4 cores, and a data directory on MICROSD.
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - work_mem=16MB
      # The app's pool is POOL_SIZE (10 by default) and `migrate` opens its own.
      # 50 leaves room for both plus a psql session, without reserving memory
      # for connections that will never exist.
      - -c
      - max_connections=50
      # The four WAL settings below all trade latency for FEWER, LARGER writes.
      # Flash wears out by write volume, and frequent small checkpoints are the
      # worst case for it. Revisit them if the data directory ever moves to an
      # SSD, where the tradeoff stops paying for itself.
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      # Random reads on flash are far cheaper than the 4.0 default assumes, and
      # leaving it there pushes the planner toward sequential scans it should
      # not choose. Not as low as the 1.1 an NVMe would justify.
      - -c
      - random_page_cost=2.0
      - -c
      - effective_io_concurrency=100
      # Surfaces the scrapers' slowest queries without the write amplification
      # of logging every statement.
      - -c
      - log_min_duration_statement=1000

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the image and reported by `/health`, so verifying a deploy
        # collapses to one request instead of comparing a commit date, an image
        # date and a container start time by eye:
        #
        #     curl -s http://127.0.0.1:4000/health | jq -r .version
        #
        # Compose cannot run git itself and `.git` is excluded from the build
        # context, so the deploy supplies it:
        #
        #     GIT_SHA=$(git rev-parse --short HEAD) docker compose build app
        #
        # Left unset the image reports "unknown" and the build still succeeds —
        # build metadata must never be able to fail a deploy.
        GIT_SHA: "${GIT_SHA:-}"
    image: eft-buddy:local
    restart: unless-stopped
    env_file: .env
    depends_on:
      # Not merely "started". Ecto opens its pool during boot, so a database
      # that is running but not yet accepting connections turns every deploy
      # into a race that usually wins and occasionally does not.
      db:
        condition: service_healthy
    ports:
      # Set BIND_ADDR=127.0.0.1 in .env. The tunnel that fronts this app runs on
      # this same host and dials outbound, so nothing needs to reach port 4000
      # from the LAN — and publishing it there would bypass TLS.
      - "${BIND_ADDR:-0.0.0.0}:${APP_PORT:-4000}:4000"
      # The operator dashboard (LiveDashboard), pinned to LOOPBACK on the host.
      #
      # The `127.0.0.1:` prefix is the entire access control and is not
      # cosmetic: without it Docker binds 0.0.0.0 and publishes a page that can
      # read ETS, list processes and KILL them to the whole network. With it,
      # nothing off this machine can route to the port at all.
      #
      # Reach it from a workstation by forwarding the port over SSH — the tunnel
      # terminates ON this host, which is what satisfies the loopback binding,
      # and opening it requires the operator's SSH key:
      #
      #     ssh -N -L 4001:127.0.0.1:4001 user@pi5
      #     # then browse http://localhost:4001/dashboard
      #
      # The container still listens on 0.0.0.0 internally (Docker cannot map a
      # loopback-bound container port); the namespace is only reachable through
      # this published mapping. Inert unless ADMIN_DASHBOARD_PORT is set in .env
      # — without it the endpoint never starts and this maps to a closed port.
      - "127.0.0.1:${ADMIN_DASHBOARD_PORT:-4001}:${ADMIN_DASHBOARD_PORT:-4001}"
    healthcheck:
      # Pure TCP check, via bash's /dev/tcp. Deliberately NOT curl: the runtime
      # image does not ship it (the Dockerfile installs only libstdc++6, openssl,
      # libncurses6, locales and ca-certificates), and a healthcheck invoking a
      # missing binary marks the container unhealthy forever.
      #
      # This proves Bandit is accepting connections, not that the app is healthy
      # end to end. The real signal is the /health endpoint, which goes through
      # the router and touches the database. Here we only want to know the
      # process is up.
      test: ["CMD-SHELL", "bash -c ': < /dev/tcp/127.0.0.1/4000'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # One-shot. Deliberately outside the app's startup: migrating on boot makes
  # every restart race itself as soon as there is more than one instance, and
  # turns a failed migration into a crash-loop instead of a legible error.
  #
  # `profiles` keeps it out of `docker compose up`; run it explicitly with
  # `docker compose run --rm migrate`.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      # Same argument as `app`: both services name the same image tag, so a
      # build triggered through this one must not silently replace a
      # SHA-stamped image with an unstamped one.
      args:
        GIT_SHA: "${GIT_SHA:-}"
    image: eft-buddy:local
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: ["/app/bin/migrate"]
    restart: "no"
    profiles: ["tools"]

  # The tunnel. Dials OUT to Cloudflare's edge and holds the connection open, so
  # this host needs no inbound port, no port forwarding, and no static IP — and
  # the public DNS for eftbuddy.app points at Cloudflare, never at this network.
  #
  # Ingress rules live in Cloudflare, not here: the tunnel was created with
  # `config_src: cloudflare`, so `run` fetches its routing over the API. The
  # mapping is eftbuddy.app -> http://app:4000, with a 404 catch-all. That
  # catch-all is what keeps www.eftbuddy.app OFF the app: PHX_HOST is compared
  # verbatim against the Origin header, so serving the app on a second hostname
  # would render pages and then silently reject every LiveView socket. www is
  # redirected to the apex at the edge instead.
  #
  # `app:4000` is reached over the compose network, so the app needs no published
  # host port for the public site to work at all.
  #
  # No healthcheck: the image ships no shell, so a CMD-SHELL test cannot run.
  # Tunnel health is visible in `docker compose logs cloudflared` and in
  # Cloudflare's own dashboard, which sees the connection from the far end.
  cloudflared:
    # Pinned, like every other image here. Cloudflare DOES refuse connections
    # from sufficiently old clients, so unlike the others this pin needs a
    # deliberate bump now and then rather than never — check the release notes
    # if the tunnel ever starts logging protocol or version warnings.
    image: cloudflare/cloudflared:2026.8.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # From .env. Carries the tunnel's identity and credentials, so it is as
      # sensitive as a private key: it alone is enough to impersonate this
      # tunnel and receive the site's traffic.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN must be set in .env}
    depends_on:
      # Nothing is gained by advertising the tunnel before the app can answer.
      app:
        condition: service_healthy

volumes:
  # Named, not a bind mount — see the rootless note at the top of this file.
  # On this host it resolves under ~/.local/share/docker/volumes/.
  pgdata:
