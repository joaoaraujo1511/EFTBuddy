name: CI

# EVERY branch, not just main. This used to be `branches: [main]`, which meant a
# feature branch with no PR open matched NEITHER event and ran nothing at all.
# That is not a theoretical gap: the fix for a failing `hex.audit` sat pushed and
# untested on a branch while the stale failure stood on main, and the first real
# verification only happened when a PR was finally opened.
#
# `pull_request` stays alongside it, and is not redundant: it builds the merge
# commit (branch + current main) rather than the branch tip, and it is the only
# event that fires for pull requests from forks.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A PR branch now matches both triggers, so it gets two runs — one on the branch
# tip, one on the merge commit. They test different things, so neither is
# dropped; this just stops superseded runs from piling up when you push several
# times in a row. main is excluded: never cancel a run on the default branch,
# since its result is the record of whether main is green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Toolchain, pinned in one place. OTP is pinned to the FULL patch version, not
# `27.3`, which setup-beam resolves to whatever 27.3.x it publishes latest — so a
# green run would otherwise say nothing about which patch level was tested, and
# the same commit could pass and then fail a week later with no diff.
#
# Keep these in step with whatever the deploy target actually runs. That used to
# be enforced mechanically by a second job building against the same values;
# there is no such job now, so it is a manual check.
env:
  OTP_VERSION: "27.3.4.3"
  ELIXIR_VERSION: "1.18.4"

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      # The steps below mirror the `mix precommit` alias, in the same ORDER, with
      # the `--check-*` variants so the build fails on unused deps or unformatted
      # code instead of silently rewriting them like the local auto-fix alias does.
      #
      # They are spelled out rather than calling `mix precommit` because each `run:`
      # is its own process, and that matters: `hex.audit` is a Hex ARCHIVE task, and
      # once `mix compile` has run in the same OS process Mix can no longer resolve
      # it. That is why the local alias has to run the audits FIRST — a constraint
      # CI does not share. Keep this list in step with the alias in mix.exs.
      - name: Dependency vulnerability audit
        run: mix deps.audit

      - name: Retired package audit
        run: mix hex.audit

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      # Security-focused static analysis. Blocking: a finding here (e.g. a missing
      # CSP, an unsafe redirect, raw SQL) should fail CI. `--skip` honours the
      # inline `# sobelow_skip` annotations for reviewed false positives.
      - name: Sobelow security scan
        run: mix sobelow --exit Low --skip

      # The `test` alias runs `ecto.create` + `ecto.migrate` before the suite, so
      # this also exercises every migration end-to-end.
      - name: Run tests
        run: mix test

      # Prove every migration is reversible end-to-end: roll the whole schema back
      # down and migrate it back up. Catches a migration that only works in the `up`
      # direction before it ships.
      - name: Migration rollback smoke test
        run: mix ecto.rollback --all && mix ecto.migrate

      # NO CREDO STEP, deliberately. There used to be a `mix credo --strict` step
      # marked `continue-on-error: true`, with a comment saying to flip that "once
      # the backlog is cleared". There is no `.credo.exs` in the project, so it ran
      # on stock defaults against a codebase with a known nesting/complexity
      # backlog: permanently red, permanently ignored, with no baseline to clear and
      # no owner. A step that cannot fail is not a check, it is decoration that
      # trains readers to ignore the annotations next to it. Bring it back with a
      # `.credo.exs` tuned to this codebase and `continue-on-error: false`, or not at
      # all.

  # Builds the production container image. The project IS deployed as a container
  # now (Dockerfile at the repository root), and until this existed the entire prod
  # path — config/prod.exs's compile-time `force_ssl` and `cache_static_manifest`,
  # `mix assets.deploy`, and `mix release` itself — was exercised by nothing. A
  # release that cannot be built is the kind of breakage you want to discover on a
  # pull request, not while ssh'd into a server.
  #
  # BUILDS FOR BOTH DEPLOY ARCHITECTURES. An image built for the wrong one fails
  # at `exec` time with a format error rather than at build time, so each target
  # has to be proved separately:
  #
  #   * linux/arm64 — Oracle's Always Free tier, which is Ampere. Emulated, slow.
  #   * linux/amd64 — the self-hosted x86_64 VM the app actually runs on today.
  #     Native on this runner, so it costs almost nothing to add, and it is the
  #     case that broke: the Dockerfile's old Debian pin had no amd64 manifest at
  #     all, which no arm64-only build could have caught.
  #
  # Emulated arm64 is slow, which is why this is a separate job rather than
  # another step in `test` — it runs in parallel and never delays the test signal.
  #
  # `push: false` — this proves the image BUILDS. Publishing it would need a
  # registry and credentials, and this repository is public: a workflow with
  # push rights to a registry is a much larger blast radius than a workflow that
  # only compiles. Add that when there is somewhere to push to.
  build-image:
    name: Build production image (amd64 + arm64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          # GitHub Actions cache, so an unchanged mix.lock does not recompile
          # every dependency under emulation on each run.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The artefact-build job above replaced an older one that was deleted as unused.
  # Of the two things that went with it, one was already covered elsewhere:
  #
  #   * The blank/missing PHX_HOST guard — COVERED. `test/eft_buddy_web/
  #     runtime_config_test.exs` evaluates config/runtime.exs with `Config.Reader`
  #     under `env: :prod` and asserts missing, blank and whitespace-only are all
  #     refused, for every required variable. That is a stricter check than the
  #     image job's single case, and it runs in the `test` job above.
  #
  #   * The prod COMPILE path — NOW COVERED, by `build-image` above. It was the
  #     open item in this comment for as long as there was no release target.
  #     `mix release` needs no `releases:` key in mix.exs, contrary to what this
  #     note used to claim: the defaults are sufficient, and the release is
  #     shaped by rel/overlays and the Dockerfile instead.
  #
  # Still NOT covered: that the built image actually BOOTS. The job proves it
  # compiles and links, not that the release starts, reaches the database and
  # serves a request. Doing that properly needs real secrets and a reachable
  # Postgres over TLS, which is a bigger change than it looks — and getting it
  # wrong means putting production credentials into a public repository's CI.
  # The first boot on the VM is the current test for this, deliberately.
