name: Feature request
description: An idea for something the site could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the in-raid moment this would help with.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: data
    attributes:
      label: Where would the data come from?
      description: >-
        Everything on the site comes from the tarkov.dev API or the Escape from
        Tarkov Wiki. If you know which one has what this needs, say so.
